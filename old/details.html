<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amma's Pastries | Luxury Bakery</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

</head>
<body class="flex h-screen overflow-hidden">
<div class="header"></div>
<main class="flex-1 flex flex-col min-w-0 ">
   
    <div class="p-4 md:p-8 lg:p-10 ">
        <h1 class="lg:!pb-3 !pb-2 font-semibold text-[#F36E21] text-[35px] md:text-[45px] lg:text-[55px] ">Kalyan Nagar</h1>
    <div class=""><hr class="border-[#CCCCCC]"></div>

    </div>
    <div class="flex-1 overflow-y-auto custom-scroll px-4 md:px-8 lg:px-10">
         <div class="lg:pb-12 pb-8 sm:pb-10">
             <div class="pb-4 md:pb-8 lg:pb-10 flex flex-wrap items-center justify-between gap-4">
        
                <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="lg:hidden w-10 h-10 rounded-lg bg-gray-100 flex items-center justify-center">
                <i class="fa-solid fa-bars"></i>
                </button>
                <h1 class="literata text-[25px] md:text-[30px] lg:text-[35px] ">Images</h1>
                </div>

                <button class="flex items-center gap-2 border border-[#CCCCCC] px-4 md:px-5 py-2 lg:rounded-[10px] sm:rounded-[8px] rounded-[6px] lg:text-[17px] sm:text-[15px] text-[13px] font-medium hover:text-white hover-gradient">
                <i class="fa-solid fa-volume-high"></i>
                <span class="uppercase  whitespace-nowrap">Upload  Images</span>
                </button>
            </div>
            <div id="card-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-6 gap-4 xl:gap-5"></div>
            </div>
        
        <div class="lg:pb-12 pb-8 sm:pb-10">
             <div class="pb-4 md:pb-8 lg:pb-10 flex flex-wrap items-center justify-between gap-4">
        
                <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="lg:hidden w-10 h-10 rounded-lg bg-gray-100 flex items-center justify-center">
                <i class="fa-solid fa-bars"></i>
                </button>
                <h1 class="literata text-[25px] md:text-[30px] lg:text-[35px] ">Videos</h1>
                </div>

                <button class="flex items-center gap-2 border border-[#CCCCCC] px-4 md:px-5 py-2 lg:rounded-[10px] sm:rounded-[8px] rounded-[6px] lg:text-[17px] sm:text-[15px] text-[13px] font-medium hover:text-white hover-gradient">
                <i class="fa-solid fa-volume-high"></i>
                <span class="uppercase  whitespace-nowrap">Upload  Videos</span>
                </button>
            </div>
            <div id="videocard-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-6 gap-4 xl:gap-5"></div>
            </div>
        
        <div class="lg:pb-12 pb-8 sm:pb-10">
            <div class="pb-4 md:pb-8 lg:pb-10 flex flex-wrap items-center justify-between gap-4">
        
                <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="lg:hidden w-10 h-10 rounded-lg bg-gray-100 flex items-center justify-center">
                <i class="fa-solid fa-bars"></i>
                </button>
                <h1 class="literata text-[25px] md:text-[30px] lg:text-[35px] ">Announcements</h1>
                </div>

                <button class="flex items-center gap-2 border border-[#CCCCCC] px-4 md:px-5 py-2 lg:rounded-[10px] sm:rounded-[8px] rounded-[6px] lg:text-[17px] sm:text-[15px] text-[13px] font-medium hover:text-white hover-gradient">
                <i class="fa-solid fa-volume-high"></i>
                <span class="uppercase  whitespace-nowrap">Add Announcements</span>
                </button>
            </div>
            <!-- FORM 1: Create New Announcement -->
            <div class="mb-10">
                <div class="bg-[#F3F3F3] rounded-sm w-full h-44 p-4 mb-4">
                    <textarea id="announcementInput" class="w-full h-full bg-transparent border-none outline-none resize-none text-gray-700" placeholder="Enter Your Message"></textarea>
                </div>

                <!-- <div class="flex justify-end lg:mt-8 sm:mt-6 mt-4">
                                <button onclick="submitNewAnnouncement()" class="flex-1 md:flex-none px-6 md:px-8 py-2 border border-[#F36E21] lg:rounded-[10px] sm:rounded-[8px] rounded-[6px] lg:text-[17px] sm:text-[15px] text-[13px] font-medium banner-gradient text-white">Submit</button>
                </div> -->
            </div>
        </div>
    </div>
<footer class="fixed bottom-0 left-0 right-0 lg:left-72 bg-white/95 backdrop-blur-md border-t border-gray-100 p-4 md:p-6 flex justify-center md:justify-end gap-3 z-20">
<button  onclick="openBranchPopup()" class="flex-1 md:flex-none px-6 md:px-8 py-2 border border-[#F36E21] lg:rounded-[10px] sm:rounded-[8px] rounded-[6px] lg:text-[17px] sm:text-[15px] text-[13px] font-medium  hover-gradient hover:text-white ">Clone</button>
<button class="flex-1 md:flex-none px-6 md:px-8 py-2 border border-[#F36E21] lg:rounded-[10px] sm:rounded-[8px] rounded-[6px] lg:text-[17px] sm:text-[15px] text-[13px]  font-medium hover-gradient hover:text-white">Submit</button>
</footer>

</main>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="script.js"></script>
<script src="details.js"></script>
