<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="images/logo.png">
<script>
  (function() {
    const params = new URLSearchParams(window.location.search);
    const branchParam = params.get('branch');
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const cleanUrlBranch = (pathParts.length === 2 && pathParts[0] === 'announcements') ? pathParts[1] : null;
    const branchSlug = branchParam || cleanUrlBranch;
    if (!branchSlug) {
      if (!localStorage.getItem('adminToken') || localStorage.getItem('userRole') !== 'admin') {
        window.location.replace('/login');
      }
    }
  })();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="/">
<title>Amma's Pastries | Luxury Bakery</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<link rel="stylesheet" href="style.css" rel="stylesheet"/>
</head>
<body class="flex h-screen overflow-hidden">
<div class="header"></div>
<main class="flex-1 flex flex-col min-w-0">
<div class="p-4 md:p-8 lg:p-10 flex flex-wrap items-center justify-between gap-4">
<div class="flex items-center gap-4">
<button onclick="toggleSidebar()" class="lg:hidden w-10 h-10 rounded-lg bg-gray-100 flex items-center justify-center">
<i class="fa-solid fa-bars"></i>
</button>
<h1 class="literata text-[25px] md:text-[30px] lg:text-[35px] ">Announcements</h1>
</div>

    <div id="ann-header-actions" class="flex items-center gap-2">
        <button id="add-ann-btn" onclick="submitNewAnnouncement()" class="flex items-center gap-2 border border-[#CCCCCC] px-4 md:px-5 py-1 lg:rounded-[10px] sm:rounded-[8px] rounded-[6px] lg:text-[17px] sm:text-[15px] text-[13px] font-medium hover:text-white hover-gradient">
            <i class="fa-solid fa-volume-high"></i>
            <span class="uppercase  whitespace-nowrap">Add Announcements</span>
        </button>
        <button onclick="testDisplaySign()"
            class="flex items-center gap-2 border border-[#F36E21] text-[#F36E21] px-4 md:px-5 py-1 lg:rounded-[10px] sm:rounded-[8px] rounded-[6px] lg:text-[17px] sm:text-[15px] text-[13px] font-medium hover:bg-[#F36E21] hover:text-white transition-all cursor-pointer">
            <i class="fa-solid fa-desktop text-sm"></i>
            <span class="uppercase whitespace-nowrap">Test Display</span>
        </button>
    </div>
</div>
  <div class="flex-1 overflow-y-auto custom-scroll px-4 md:px-8 lg:px-10 pb-32">
        <!-- Banner Settings Section -->
        <div id="ann-banner-section" class="pb-8 border-b border-gray-100 mb-6 mt-4">
            <h3 class="literata text-[22px] md:text-[28px] lg:text-[32px] leading-normal pb-4">Banner Settings</h3>
            <div id="banner-setting-card" class="bg-gray-50 p-4 rounded-2xl flex items-center justify-between border border-gray-100 shadow-sm max-w-md">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-[#F36E21]/10 flex items-center justify-center text-[#F36E21]">
                        <i class="fa-solid fa-scroll text-lg"></i>
                    </div>
                    <div>
                        <p class="font-bold text-black text-sm md:text-base">Announcement Banner</p>
                        <p class="text-xs text-gray-500">Show or hide scrolling text bar on TV</p>
                    </div>
                </div>
                <button id="bannerToggleBtn" onclick="toggleBannerClick()" class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors focus:outline-none" style="background:#d1d5db">
                    <span id="bannerToggleKnob" class="inline-block h-4 w-4 transform rounded-full bg-white shadow transition-transform translate-x-1"></span>
                </button>
            </div>
        </div>
        
        <!-- FORM 1: Create New Announcement -->
        <div id="ann-create-form" class="mb-10">
            <div class="bg-[#F3F3F3] rounded-sm w-full h-44 p-4 mb-4">
                <textarea id="announcementInput" class="w-full h-full bg-transparent border-none outline-none resize-none text-gray-700" placeholder="Enter Your Message"></textarea>
            </div>

            <div class="flex justify-end lg:mt-8 sm:mt-6 mt-4">
                             <button onclick="submitNewAnnouncement()" class="flex-1 md:flex-none px-6 md:px-8 py-2 border border-[#F36E21] lg:rounded-[10px] sm:rounded-[8px] rounded-[6px] lg:text-[17px] sm:text-[15px] text-[13px] font-medium banner-gradient text-white">Submit</button>
            </div>
        </div>
        <div class="my-5 "></div>

        <!-- FORM 2: List of Items with Checkboxes -->
        <div id="announcement-list" class="space-y-3 mb-6">
            <!-- Loaded dynamically from API -->
        </div>

    </div>

    <!-- Footer with Submit button -->
    <footer id="details-footer" class="fixed bottom-0 left-0 right-0 lg:left-72 bg-white/95 backdrop-blur-md border-t border-gray-100 p-4 md:p-6 flex justify-end gap-3 z-20">
      <button onclick="updateAnnouncementList()"
        class="flex-1 md:flex-none px-6 md:px-8 py-2 border border-[#F36E21] lg:rounded-[10px] sm:rounded-[8px] rounded-[6px] lg:text-[17px] sm:text-[15px] text-[13px] font-medium hover-gradient hover:text-white">
        Submit
      </button>
    </footer>

    <!-- CUSTOM CONFIRMATION MODAL -->
    <div id="confirmDeleteModal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
      <div class="bg-white rounded-2xl shadow-2xl p-6 md:p-8 max-w-sm w-full border border-gray-100 animate-in fade-in zoom-in-95 duration-200 text-center">
        <div class="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4 animate-pulse">
          <i class="fa-solid fa-triangle-exclamation text-2xl"></i>
        </div>
        <h3 class="literata text-xl md:text-2xl font-bold text-gray-900 mb-2">Delete Announcement?</h3>
        <p class="text-sm md:text-base text-gray-500 mb-6">Are you sure you want to delete this announcement? This action is permanent and cannot be undone.</p>
        <div class="flex gap-3">
          <button onclick="closeConfirmDeleteModal()" class="flex-1 py-2 px-4 border border-[#CCCCCC] rounded-xl text-gray-700 hover:bg-gray-50 font-medium transition-all text-sm md:text-base cursor-pointer">Cancel</button>
          <button id="confirmDeleteBtn" class="flex-1 py-2 px-4 bg-gradient-to-r from-[#F36E21] to-[#D3540A] text-white rounded-xl hover:shadow-lg font-medium transition-all text-sm md:text-base cursor-pointer">Delete</button>
        </div>
      </div>
    </div>

</main>
<script src="script.js?v=3"></script>
<script src="details.js?v=3"></script>
<script>
  // If on a branch-specific announcements page, hide editing controls
  (function() {
    // Detect branch from both ?branch= param AND clean URL /announcements/slug
    const params = new URLSearchParams(window.location.search);
    const branchParam = params.get('branch');
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const cleanUrlBranch = (pathParts.length === 2 && pathParts[0] === 'announcements') ? pathParts[1] : null;
    const branchSlug = branchParam || cleanUrlBranch;

    if (branchSlug) {
      // Hide: Add Announcements button, textarea form, footer
      const hide = ['add-ann-btn', 'ann-create-form', 'details-footer'];
      hide.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = 'none';
      });
      // Also hide the spacer div between form and list
      const spacer = document.querySelector('.my-5');
      if (spacer) spacer.style.display = 'none';
      // Update the title to show branch name
      const displayName = branchSlug.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      const h1 = document.querySelector('h1');
      if (h1) h1.textContent = displayName + ' — Announcements';
    }
  })();
</script>
</body>
</html>
