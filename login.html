<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="images/logo.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/">
  <title>Amma's Pastries | Admin Portal Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background: radial-gradient(circle at center, #1e1510 0%, #0c0806 100%);
    }
    .literata {
      font-family: 'Playfair Display', serif;
    }
    .glass-card {
      background: rgba(20, 14, 11, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(243, 110, 33, 0.15);
    }
    .gold-gradient-text {
      background: linear-gradient(135deg, #f9a066 0%, #f36e21 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .gold-button {
      background: linear-gradient(135deg, #f36e21 0%, #c24d10 100%);
      box-shadow: 0 4px 20px rgba(243, 110, 33, 0.3);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .gold-button:hover {
      box-shadow: 0 6px 25px rgba(243, 110, 33, 0.5);
      transform: translateY(-2px);
    }
    .gold-button:active {
      transform: translateY(0);
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 overflow-hidden relative">
  <!-- Decorative background glow blobs -->
  <div class="absolute w-[400px] h-[400px] rounded-full bg-[#f36e21]/5 blur-[120px] top-1/4 left-1/4"></div>
  <div class="absolute w-[300px] h-[300px] rounded-full bg-[#c24d10]/5 blur-[100px] bottom-1/4 right-1/4"></div>

  <div class="w-full max-w-[450px] glass-card rounded-[24px] p-8 md:p-10 shadow-2xl relative z-10 animate-in fade-in zoom-in duration-500">
    <div class="flex flex-col items-center text-center">
      <div class="w-16 h-16 rounded-full bg-gradient-to-tr from-[#f36e21]/20 to-[#c24d10]/20 flex items-center justify-center border border-[#f36e21]/30 mb-6 shadow-inner">
        <i class="fa-solid fa-lock gold-gradient-text text-2xl"></i>
      </div>
      <h2 class="literata text-3xl font-bold text-white mb-2 tracking-wide">Amma's Pastries</h2>
      <p id="portalSubtitle" class="text-[#f9a066]/70 text-sm font-medium uppercase tracking-wider mb-8">Staff Portal</p>
    </div>

    <!-- Step 1: Passcode -->
    <div id="step-passcode" class="space-y-6">
      <div class="space-y-2 relative">
        <label for="passcode" class="text-xs font-semibold text-[#f9a066] uppercase tracking-wider pl-1">Enter Passcode</label>
        <div class="relative">
          <input type="password" id="passcode" placeholder="••••••••"
                 class="w-full px-5 py-4 bg-black/40 border border-[#f36e21]/20 rounded-2xl text-white placeholder-gray-600 focus:outline-none focus:border-[#f36e21] focus:ring-1 focus:ring-[#f36e21] transition-all text-center tracking-widest text-lg font-bold">
          <button onclick="togglePasswordVisibility()" class="absolute right-5 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white transition-colors">
            <i id="toggleIcon" class="fa-solid fa-eye text-sm"></i>
          </button>
        </div>
      </div>
      <div id="errorMessage" class="hidden text-red-500 text-sm font-bold text-center bg-red-950/20 border border-red-500/20 py-3 rounded-xl">
        <i class="fa-solid fa-triangle-exclamation mr-1.5"></i> Invalid Passcode
      </div>
      <button id="loginBtn" onclick="handleLogin()"
              class="w-full py-4 rounded-2xl text-white font-bold text-md tracking-wider gold-button flex items-center justify-center gap-2">
        <span id="btnText">Sign In</span>
        <i id="btnIcon" class="fa-solid fa-arrow-right text-sm"></i>
      </button>
    </div>

    <!-- Step 2: Branch selector (branch users only) -->
    <div id="step-branch" class="hidden space-y-6">
      <div class="text-center space-y-1">
        <p class="text-[#f9a066] text-sm font-semibold uppercase tracking-wider">Select Your Branch</p>
        <p class="text-white/40 text-xs">Choose the branch you manage</p>
      </div>
      <div id="branchList" class="space-y-2 max-h-64 overflow-y-auto pr-1">
        <p class="text-white/40 text-xs text-center">Loading branches...</p>
      </div>
      <div id="branchError" class="hidden text-red-500 text-sm font-bold text-center bg-red-950/20 border border-red-500/20 py-3 rounded-xl">
        Please select a branch to continue.
      </div>
    </div>
  </div>

  <script src="script.js?v=3"></script>
  <script>
    // API_BASE is declared globally in script.js and reused here

    // Read branch from URL if staff are using a direct branch link
    const urlParams = new URLSearchParams(window.location.search);
    const branchFromUrl = urlParams.get('branch') || '';

    // Show branch name in subtitle if this is a branch-specific login link
    if (branchFromUrl) {
      document.getElementById('portalSubtitle').innerText = branchFromUrl;
    }

    // Redirect if already authenticated
    (function() {
      const token = localStorage.getItem('adminToken');
      const role = localStorage.getItem('userRole');
      if (!token || !role) return; // not logged in, show form

      const branch = branchFromUrl || localStorage.getItem('userBranch') || '';
      if (role === 'admin') {
        _navigate('branch.html');
      } else if (branch) {
        _navigate('details.html?branch=' + encodeURIComponent(branch));
      } else {
        // Branch user with no branch context — clear stale session and show login form
        localStorage.removeItem('adminToken');
        localStorage.removeItem('userRole');
        localStorage.removeItem('userBranch');
      }
    })();

    function togglePasswordVisibility() {
      const input = document.getElementById('passcode');
      const icon = document.getElementById('toggleIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    document.getElementById('passcode').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') handleLogin();
    });

    function handleLogin() {
      const passcode = document.getElementById('passcode').value.trim();
      const loginBtn = document.getElementById('loginBtn');
      const btnText = document.getElementById('btnText');
      const btnIcon = document.getElementById('btnIcon');
      const errMsg = document.getElementById('errorMessage');

      if (!passcode) { showError("Please enter a passcode"); return; }

      loginBtn.disabled = true;
      btnText.innerText = 'Verifying...';
      btnIcon.className = 'fa-solid fa-circle-notch fa-spin text-sm';
      errMsg.classList.add('hidden');

      fetch(`${API_BASE}/api/auth/verify`, { headers: { 'Authorization': passcode } })
        .then(res => {
          if (!res.ok) throw new Error('Unauthorized');
          return res.json();
        })
        .then(data => {
          const role = data.role || 'admin'; // default to admin if server doesn't return role
          localStorage.setItem('adminToken', passcode);
          localStorage.setItem('userRole', role);

          if (role === 'admin') {
            _navigate('branch.html');
          } else if (branchFromUrl) {
            localStorage.setItem('userBranch', branchFromUrl);
            _navigate('details.html?branch=' + encodeURIComponent(branchFromUrl));
          } else {
            // No branch in URL — show selector as fallback
            showBranchSelector();
          }
        })
        .catch(() => showError("Access Denied: Invalid Passcode"))
        .finally(() => {
          loginBtn.disabled = false;
          btnText.innerText = 'Sign In';
          btnIcon.className = 'fa-solid fa-arrow-right text-sm';
        });
    }

    function showBranchSelector() {
      document.getElementById('step-passcode').classList.add('hidden');
      document.getElementById('step-branch').classList.remove('hidden');

      fetch(`${API_BASE}/api/branches`)
        .then(r => r.json())
        .then(branches => {
          const list = document.getElementById('branchList');
          list.innerHTML = '';
          branches.forEach(b => {
            const btn = document.createElement('button');
            btn.className = 'w-full text-left px-5 py-3 rounded-2xl bg-black/30 border border-[#f36e21]/20 text-white font-medium hover:border-[#f36e21] hover:bg-[#f36e21]/10 transition-all flex items-center gap-3';
            btn.innerHTML = `<i class="fa-solid fa-store text-[#f36e21] text-sm"></i> ${b.name} <span class="ml-auto text-[#f9a066]/50 text-xs">${b.state}</span>`;
            btn.onclick = () => selectBranch(b.name);
            list.appendChild(btn);
          });
        })
        .catch(() => {
          document.getElementById('branchList').innerHTML = '<p class="text-red-400 text-xs text-center">Could not load branches.</p>';
        });
    }

    function selectBranch(branchName) {
      localStorage.setItem('userBranch', branchName);
      _navigate('details.html?branch=' + encodeURIComponent(branchName));
    }

    function showError(text) {
      const errMsg = document.getElementById('errorMessage');
      errMsg.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-1.5"></i> ${text}`;
      errMsg.classList.remove('hidden');
    }
  </script>
</body>
</html>
