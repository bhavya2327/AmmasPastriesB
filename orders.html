<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="images/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/">
    <title>Amma's Pastries | Orders Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css" rel="stylesheet"/>
</head>
<body class="flex h-screen overflow-hidden">
    <div class="header"></div>

    <main class="flex-1 flex flex-col min-w-0">
        <div class="p-4 md:p-8 lg:p-10">
            <div class="flex items-center justify-between lg:pb-3 pb-2">
                <div class="flex items-center gap-3">
                  <button onclick="toggleSidebar()" class="lg:hidden w-10 h-10 rounded-lg bg-gray-100 flex items-center justify-center">
                    <i class="fa-solid fa-bars"></i>
                  </button>
                  <h1 id="ordersHeader" class="font-semibold text-[#F36E21] text-[28px] md:text-[38px] lg:text-[45px] capitalize">Tokens</h1>
                </div>
                <button onclick="goToMedia()"
                  class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium text-[#F36E21] border border-[#F36E21] hover:bg-[#F36E21] hover:text-white transition-all">
                  <i class="fa-solid fa-arrow-left text-xs"></i>
                  <span class="hidden sm:inline">Back to Media</span>
                </button>
            </div>
            <div><hr class="border-[#CCCCCC]"></div>
        </div>

        <div class="flex-1 overflow-y-auto custom-scroll px-4 md:px-8 lg:px-10 pb-20">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-4xl">
                <!-- LEFT COLUMN: LIVE READY LIST -->
                <div class="space-y-4">
                    <h3 class="literata text-2xl font-bold text-gray-800">Current Queue</h3>
                    <p class="text-xs text-gray-400">Click on an order card below to mark it as picked-up/completed.</p>
                    <div id="ordersQueue" class="space-y-2 max-h-[60vh] overflow-y-auto custom-scroll pr-2">
                        <!-- Dynamically loaded ready orders list -->
                    </div>
                </div>

                <!-- RIGHT COLUMN: ADD ORDER FORM + TOKEN TOGGLE -->
                <div class="space-y-4">
                  <div class="bg-[#F3F3F3] rounded-2xl p-6 space-y-4 shadow-sm border border-gray-100">
                      <h3 class="literata text-xl font-bold text-gray-800">Mark Order Ready</h3>
                      <p class="text-xs text-gray-400">Enter the token number when a customer's order is ready for pickup.</p>

                      <div>
                          <label class="block text-xs font-semibold text-gray-500 mb-1">Token Number</label>
                          <input
                            type="text"
                            id="orderTokenId"
                            placeholder="e.g. 34562"
                            class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-700 placeholder-gray-400 transition-all outline-none focus:border-[#F36E21]"
                            onkeypress="if(event.key==='Enter') addReadyOrder()"
                          >
                      </div>

                      <button onclick="addReadyOrder()" class="w-full py-2.5 border border-[#F36E21] rounded-lg text-sm font-semibold banner-gradient text-white shadow-md hover:opacity-95 transition-all">
                          <i class="fa-solid fa-bell mr-2"></i> Notify Customer
                      </button>
                  </div>

                  <!-- Token system toggle -->
                  <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 flex items-center justify-between gap-4">
                      <div>
                          <p class="text-sm font-bold text-gray-800">Token System</p>
                          <p id="tokenStatusLabel" class="text-xs text-gray-400 mt-0.5">Loading...</p>
                      </div>
                      <button id="tokenToggleBtn" onclick="toggleTokens()" class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors focus:outline-none" style="background:#d1d5db">
                          <span id="tokenToggleKnob" class="inline-block h-4 w-4 transform rounded-full bg-white shadow transition-transform translate-x-1"></span>
                      </button>
                  </div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js?v=3"></script>
    <script>
        // Set dynamic headers
        const currentBranch = getBranchFromUrl() || 'Kalyan Nagar';

        function goToMedia() {
            const branch = getBranchFromUrl() || currentBranch;
            const slug = branch.toLowerCase().trim().replace(/\s+/g, '-');
            const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            const isCleanActive = isLocal || window.location.hostname === 'tv.spydernet.in';
            if (isCleanActive) {
                window.location.href = '/' + slug;
            } else {
                window.location.href = 'media.html?branch=' + encodeURIComponent(branch);
            }
        }

        document.getElementById('ordersHeader').innerText = `Tokens — ${currentBranch}`;

        // Fetch and load orders for this branch
        function loadOrders() {
            const branch = getBranchFromUrl() || currentBranch;

            fetch(`/api/branches/${encodeURIComponent(branch)}/orders`)
                .then(res => res.json())
                .then(orders => {
                    const container = document.getElementById('ordersQueue');
                    container.innerHTML = '';

                    if (orders.length === 0) {
                        container.innerHTML = '<div class="text-center text-gray-400 py-10 text-sm italic bg-white rounded-xl border border-dashed border-gray-200">No orders in queue.</div>';
                        return;
                    }

                    orders.forEach(o => {
                        const card = document.createElement('div');
                        card.className = 'w-full py-3 px-4 bg-white border border-gray-100 hover:border-red-200 hover:bg-red-50/20 text-gray-800 rounded-xl transition-all duration-200 font-medium tracking-wide flex justify-between items-center shadow-sm cursor-pointer group';
                        card.onclick = () => removeOrder(o.id, o.token);
                        
                        card.innerHTML = `
                            <div class="flex flex-col">
                                <span class="font-extrabold text-sm lg:text-base group-hover:text-red-600 transition-all">Token #${o.token}</span>
                                <span class="text-[10px] text-gray-400">Mark completed</span>
                            </div>
                            <span class="bg-[#F36E21] text-white px-3 py-1 rounded-lg text-xs lg:text-sm font-black shadow-sm group-hover:bg-red-500 transition-all">#${o.token}</span>
                        `;
                        container.appendChild(card);
                    });
                })
                .catch(err => console.error("Error loading orders queue:", err));
        }

        // Add ready order
        function addReadyOrder() {
            const tokenInput = document.getElementById('orderTokenId');
            const token = tokenInput.value.trim();

            if (!token) {
                showToast("Please enter a Token/Order ID.", "error");
                return;
            }

            const branch = getBranchFromUrl() || currentBranch;
            fetch(`/api/branches/${encodeURIComponent(branch)}/orders`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: '', token: token })
            })
            .then(res => {
                if (!res.ok) return res.json().then(data => { throw new Error(data.error || 'Failed to add order'); });
                return res.json();
            })
            .then(data => {
                tokenInput.value = '';
                loadOrders();
                showToast(`Order token #${token} marked ready!`);
            })
            .catch(err => showToast("Error: " + err.message, "error"));
        }

        let confirmAction = null;
        
        function showConfirmModal(message, onConfirm) {
            document.getElementById('confirmMessage').innerText = message;
            document.getElementById('confirmModal').classList.remove('hidden');
            confirmAction = onConfirm;
        }

        // Delete/Complete ready order
        function removeOrder(orderId, token) {
            showConfirmModal(`Mark Order #${token} as completed/picked-up?`, () => {
                const branch = getBranchFromUrl() || currentBranch;
                fetch(`/api/branches/${encodeURIComponent(branch)}/orders/${orderId}`, {
                    method: 'DELETE'
                })
                .then(res => {
                    if (!res.ok) throw new Error('Failed to remove order');
                    loadOrders();
                    showToast(`Order #${token} completed/removed.`);
                })
                .catch(err => showToast("Error: " + err.message, "error"));
            });
        }

        // Token system enable/disable
        let tokensCurrentlyEnabled = true;

        function renderTokenToggle(enabled) {
            tokensCurrentlyEnabled = enabled;
            const btn = document.getElementById('tokenToggleBtn');
            const knob = document.getElementById('tokenToggleKnob');
            const label = document.getElementById('tokenStatusLabel');
            if (enabled) {
                btn.style.background = '#F36E21';
                knob.style.transform = 'translateX(20px)';
                label.innerText = 'Enabled — tokens show on TV display';
            } else {
                btn.style.background = '#d1d5db';
                knob.style.transform = 'translateX(4px)';
                label.innerText = 'Disabled — token queue hidden on display';
            }
        }

        function loadTokenStatus() {
            const branch = getBranchFromUrl() || currentBranch;
            fetch('/api/branches')
                .then(r => r.json())
                .then(branches => {
                    const b = branches.find(x => x.name === branch || x.id === branch.toLowerCase().replace(/\s+/g, '-'));
                    renderTokenToggle(b ? b.tokensEnabled !== false : true);
                })
                .catch(() => renderTokenToggle(true));
        }

        function toggleTokens() {
            const branch = getBranchFromUrl() || currentBranch;
            const newState = !tokensCurrentlyEnabled;
            fetch('/api/branches/' + encodeURIComponent(branch) + '/tokens', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tokensEnabled: newState })
            })
            .then(r => r.json())
            .then(data => {
                renderTokenToggle(data.tokensEnabled);
                showToast('Token system ' + (data.tokensEnabled ? 'enabled' : 'disabled') + '.');
            })
            .catch(() => showToast('Failed to update token setting', 'error'));
        }

        // Initial load
        document.addEventListener("DOMContentLoaded", () => {
            loadOrders();
            loadTokenStatus();
            // Poll for dynamic queue updates every 5 seconds
            setInterval(loadOrders, 5000);
            
            document.getElementById('cancelConfirmBtn').addEventListener('click', () => {
                document.getElementById('confirmModal').classList.add('hidden');
                confirmAction = null;
            });

            document.getElementById('okConfirmBtn').addEventListener('click', () => {
                document.getElementById('confirmModal').classList.add('hidden');
                if (confirmAction) confirmAction();
                confirmAction = null;
            });
        });
    </script>
    
    <!-- Custom Confirm Modal -->
    <div id="confirmModal" class="hidden fixed inset-0 bg-black/60 z-[9999] flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-[#fcfcfc] w-full max-w-sm rounded-2xl p-6 shadow-xl transform scale-100 transition-transform">
            <h3 class="text-xl font-bold text-[#333] mb-2 literata">Confirm Action</h3>
            <p id="confirmMessage" class="text-[#555] mb-6 text-sm">Are you sure?</p>
            <div class="flex justify-end gap-3">
                <button id="cancelConfirmBtn" class="px-4 py-2 rounded-lg border border-[#CCCCCC] text-[#555] font-medium hover:bg-gray-50 transition-colors">Cancel</button>
                <button id="okConfirmBtn" class="px-4 py-2 rounded-lg bg-[#F36E21] text-white font-medium hover:bg-[#e05d15] transition-colors">OK</button>
            </div>
        </div>
    </div>
</body>
</html>
