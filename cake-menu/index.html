<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waffle Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="style.css" rel="stylesheet">
    <link href="font/stylesheet.css" rel="stylesheet">
    <style>
        .orientation-portrait {
            width: 100vw;
            height: 100vh;
            margin: auto;
        }
        .orientation-landscape {
            width: 100vw;
            height: 100vh;
            margin: auto;
        }
        body {
            display: flex;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-gray-100">
   <section id="main-section" class="h-full w-full shadow-2xl">
    <div class="relative w-full h-full bg-white flex flex-col">
        <img src="images/ice2.png" class="absolute opacity-[15%] w-full h-full object-cover top-0">
        <img src="images/ice3.png" class="absolute w-full object-contain top-0">
        <div class="w-full h-full p-[2vh] sm:p-[4vh] relative flex flex-col justify-start">
            <h1 class="text-[#BE336C] text-center uppercase tracking-widest font-extrabold text-[4vh] sm:text-[5vh] mt-[2vh] mb-[2vh] shrink-0 font-sans">MENU</h1>
            <div class="rounded-[2vh] bg-[#BE336C] relative flex-1 min-h-0 flex flex-col overflow-hidden">
                <img src="images/ice1.png" class="opacity-10 absolute w-full h-full rounded-[2vh] object-cover top-0 pointer-events-none">
                <div id="waffle-container" class="text-white flex-1 min-h-0 relative flex flex-col p-[2vh]">
                    <!-- Waffles will be loaded here dynamically -->
                    <div class="shrink-0 relative flex justify-between items-end mt-auto pt-[1vh]" id="waffle-footer">
                        <img src="images/logo.svg" alt="" class="w-[6vh] z-10">
                        <img src="images/ice4.png" alt="" class="w-[20vh] absolute -bottom-[2vh] right-[1vh] z-10 pointer-events-none">
                    </div>
                </div>
            </div>
        </div>
    </div>
   </section>

   <script>
    async function loadWaffles() {
        try {
            // Extract branch from URL query params
            const params = new URLSearchParams(window.location.search);
            const branch = params.get('branch') || '';
            
            // We use absolute path to the backend API running on the same domain
            // or relative if served through the same server. Since this HTML is served
            // at /cake-menu/ we can reach the api at /api/waffles
            let API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') ? 'http://localhost:3000' : 'https://4o62k0vv38.execute-api.ap-south-1.amazonaws.com';
            
            let apiUrl = `${API_BASE}/api/waffles?branch=${encodeURIComponent(branch)}`;
            
            const res = await fetch(apiUrl);
            if (!res.ok) throw new Error('Network response was not ok');
            const waffles = await res.json();
            
            let orientation = 'portrait';
            try {
                const configRes = await fetch(`${API_BASE}/api/waffles/config?branch=${encodeURIComponent(branch)}`);
                if (configRes.ok) {
                    const config = await configRes.json();
                    orientation = config.orientation || 'portrait';
                }
            } catch(e) { console.error('Config fetch failed', e); }
            
            const section = document.getElementById('main-section');
            if (orientation === 'landscape') {
                section.className = 'orientation-landscape';
                document.title = 'Waffle Menu - TV Landscape';
            } else {
                section.className = 'orientation-portrait';
                document.title = 'Waffle Menu - TV Portrait';
            }
            
            const container = document.getElementById('waffle-container');
            const footer = document.getElementById('waffle-footer');
            
            container.innerHTML = '';
            
            const gridDiv = document.createElement('div');
            
            // In landscape, we have much less vertical height, so dynamically calculate columns based on items
            // to ensure we don't end up with too many rows.
            let cols = 2;
            if (orientation === 'landscape') {
                cols = waffles.length > 24 ? 4 : 3;
            }
            const numRows = Math.ceil(waffles.length / cols);
            const gridColsClass = cols === 4 ? 'grid-cols-4' : (cols === 3 ? 'grid-cols-3' : 'grid-cols-2');
            gridDiv.className = `grid ${gridColsClass} flex-1 min-h-0 w-full gap-x-[2vh] z-10`;
            gridDiv.style.gridTemplateRows = `repeat(${numRows}, minmax(0, 1fr))`;
            
            waffles.forEach((w, index) => {
                const descHtml = w.description.replace(/\\n/g, '<br>');
                const colIndex = index % cols;
                const isRightMost = colIndex === cols - 1;
                
                let borderClasses = isRightMost ? 'pl-[1.5vh]' : 'border-r border-dashed border-white/40 pr-[1.5vh]';
                if (colIndex > 0 && !isRightMost) borderClasses += ' pl-[1.5vh]';
                
                // Only add bottom border if not in the last row
                const isLastRow = Math.floor(index / cols) === numRows - 1;
                const bottomBorder = isLastRow ? '' : 'border-b border-dashed border-white/40';
                
                const itemDiv = document.createElement('div');
                itemDiv.className = `flex justify-between items-center overflow-hidden ${borderClasses} ${bottomBorder}`;
                
                const priceNum = w.price.replace(/[^0-9.]/g, '');
                
                // Use vw/vh based on orientation for better responsiveness
                let nameTextClass, descTextClass, priceTextClass;
                if (orientation === 'landscape') {
                    // if lots of rows, make font smaller to fit
                    if (numRows > 8) {
                        nameTextClass = 'text-[1.8vh] sm:text-[2.2vh]';
                        descTextClass = 'text-[1.2vh] sm:text-[1.4vh]';
                        priceTextClass = 'text-[1.8vh] sm:text-[2.2vh]';
                    } else {
                        nameTextClass = 'text-[2.5vh] sm:text-[3vh]';
                        descTextClass = 'text-[1.5vh] sm:text-[1.8vh]';
                        priceTextClass = 'text-[2.5vh] sm:text-[3vh]';
                    }
                } else {
                    nameTextClass = 'text-[1.4vh] sm:text-[1.8vh]';
                    descTextClass = 'text-[1vh] sm:text-[1.2vh]';
                    priceTextClass = 'text-[1.6vh] sm:text-[2vh]';
                }
                
                itemDiv.innerHTML = `
                    <div class="flex-1 pr-[1vh] min-w-0 flex flex-col justify-center h-full">
                        <h6 class="name ${nameTextClass} font-bold leading-tight truncate">${w.name}</h6>
                        <p class="ingredients text-white/90 ${descTextClass} leading-tight truncate mt-[2px] opacity-80 block">${descHtml}</p>
                    </div>
                    <div class="pl-[1vh] shrink-0 flex items-center h-full">
                        <h5 class="price ${priceTextClass} font-bold">₹${priceNum}</h5>
                    </div>
                `;
                gridDiv.appendChild(itemDiv);
            });
            
            container.appendChild(gridDiv);
            container.appendChild(footer);
            
        } catch (error) {
            console.error('Error fetching waffles:', error);
            // Fallback could be implemented here
        }
    }
    
    // Load once DOM is ready
    document.addEventListener('DOMContentLoaded', loadWaffles);
    
    // Auto refresh every 30 seconds to keep display sign updated
    setInterval(loadWaffles, 30000);
   </script>
        </div>
    </div>
   </section>

</body>
</html>
