<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="../images/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Waffle Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="style.css" rel="stylesheet">
    <link href="font/stylesheet.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #f3f4f6;
        }

        #main-section {
            width: 100vw;
            height: 100dvh;
            /* dynamic viewport height — handles mobile browser chrome */
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin: 0 auto;
            transition: width 0.3s ease;
        }

        /* If portrait mode is forced, but the screen is wide (landscape laptop), constrain width to look like a portrait screen */
        @media (min-aspect-ratio: 1/1) {
            body[data-orientation="portrait"] #main-section {
                width: 56.25vh;
                /* 9:16 portrait aspect ratio based on screen height */
                box-shadow: 0 0 30px rgba(0, 0, 0, 0.15);
            }
        }

        #menu-inner {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            padding: 2vh;
        }

        #menu-title {
            color: #000;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-weight: 900;
            font-family: sans-serif;
            flex-shrink: 0;
            margin-bottom: 1.5vh;
        }

        #pink-box {
            background: #40E0D0;
            border-radius: 2vh;
            flex: 1;
            min-height: 0;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #pink-box>img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.1;
            border-radius: 2vh;
            pointer-events: none;
        }

        #waffle-container {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: 2vh;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        #waffle-grid {
            flex: 1;
            min-height: 0;
            display: grid;
            overflow: hidden;
            color: #000;
        }

        .waffle-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            min-height: 0;
        }

        .waffle-name {
            font-weight: 700;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .waffle-desc {
            color: rgba(0, 0, 0, 0.85);
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0.8;
        }

        .waffle-price {
            font-weight: 700;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .border-dashed-col {
            border-right: 1px dashed rgba(0, 0, 0, 0.4);
        }

        .border-dashed-row {
            border-bottom: 1px dashed rgba(0, 0, 0, 0.4);
        }
    </style>
</head>

<body>
    <section id="main-section">
        <div style="position:relative; width:100%; height:100%; background:white; display:flex; flex-direction:column;">
            <div id="menu-inner">
                <h1 id="menu-title">MENU</h1>
                <div id="pink-box">
                    <img src="images/ice1.png" alt="">
                    <div id="waffle-container">
                        <div id="waffle-grid"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        async function loadWaffles() {
            try {
                const params = new URLSearchParams(window.location.search);
                const branch = params.get('branch') || '';

                const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
                    ? 'http://localhost:3000'
                    : 'https://4o62k0vv38.execute-api.ap-south-1.amazonaws.com';

                const res = await fetch(`${API_BASE}/api/waffles?branch=${encodeURIComponent(branch)}`);
                if (!res.ok) throw new Error('Network response was not ok');
                const waffles = await res.json();

                // 1. URL param takes priority (set by Live Preview button)
                // 2. Fall back to API config saved in the database
                let orientation = params.get('orientation') || 'portrait';
                if (!params.get('orientation')) {
                    try {
                        const configRes = await fetch(`${API_BASE}/api/waffles/config?branch=${encodeURIComponent(branch)}`);
                        if (configRes.ok) {
                            const config = await configRes.json();
                            orientation = config.orientation || 'portrait';
                        }
                    } catch (e) { /* keep default */ }
                }

                renderWaffles(waffles, orientation);
            } catch (error) {
                console.error('Error fetching waffles:', error);
            }
        }

        function renderWaffles(waffles, orientation) {
            document.title = orientation === 'landscape' ? 'Waffle Menu - TV Landscape' : 'Waffle Menu - TV Portrait';
            document.body.setAttribute('data-orientation', orientation);

            const titleEl = document.getElementById('menu-title');
            titleEl.style.fontSize = orientation === 'landscape' ? '3.5vh' : '4.5vh';
            titleEl.style.marginTop = orientation === 'landscape' ? '0.5vh' : '1vh';

            const grid = document.getElementById('waffle-grid');
            grid.innerHTML = '';

            if (!waffles || waffles.length === 0) {
                grid.innerHTML = '<p style="color:#000;text-align:center;padding:2vh;">No menu items found.</p>';
                return;
            }

            // Determine columns from orientation
            const cols = orientation === 'landscape'
                ? (waffles.length > 24 ? 4 : 3)
                : 2;

            const numRows = Math.ceil(waffles.length / cols);

            // Font sizes based on orientation and row count
            let nameSz, descSz, priceSz, pad;
            if (orientation === 'landscape') {
                if (numRows > 9 || cols === 4) {
                    nameSz = '1.5vh'; descSz = '1.1vh'; priceSz = '1.5vh'; pad = '0.6vh 1vh';
                } else if (numRows > 6) {
                    nameSz = '1.8vh'; descSz = '1.2vh'; priceSz = '1.8vh'; pad = '0.8vh 1.2vh';
                } else {
                    nameSz = '2.2vh'; descSz = '1.4vh'; priceSz = '2.2vh'; pad = '1vh 1.5vh';
                }
            } else {
                if (numRows > 12) {
                    nameSz = '1.3vh'; descSz = '0.9vh'; priceSz = '1.3vh'; pad = '0.5vh 1vh';
                } else if (numRows > 8) {
                    nameSz = '1.5vh'; descSz = '1vh'; priceSz = '1.5vh'; pad = '0.7vh 1vh';
                } else {
                    nameSz = '1.8vh'; descSz = '1.2vh'; priceSz = '1.8vh'; pad = '1vh 1.2vh';
                }
            }

            grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
            grid.style.gridTemplateRows = `repeat(${numRows}, minmax(0, 1fr))`;
            grid.style.gap = '0';

            waffles.forEach((w, index) => {
                const descHtml = (w.description || '').replace(/\\n/g, '<br>');
                const priceNum = (w.price || '').replace(/[^0-9.]/g, '');

                const colIndex = index % cols;
                const rowIndex = Math.floor(index / cols);
                const isLastCol = colIndex === cols - 1;
                const isLastRow = rowIndex === numRows - 1;

                const item = document.createElement('div');
                item.className = 'waffle-item';

                let borderStyle = '';
                if (!isLastCol) borderStyle += 'border-right: 1px dashed rgba(0,0,0,0.4);';
                if (!isLastRow) borderStyle += 'border-bottom: 1px dashed rgba(0,0,0,0.4);';

                item.style.cssText = `padding: ${pad}; ${borderStyle} min-height: 0; overflow: hidden;`;

                item.innerHTML = `
                <div style="flex:1; min-width:0; padding-right:0.8vh; display:flex; flex-direction:column; justify-content:center;">
                    <div class="waffle-name" style="font-size:${nameSz};">${w.name}</div>
                    <div class="waffle-desc" style="font-size:${descSz};">${descHtml}</div>
                </div>
                <div style="flex-shrink:0; padding-left:0.5vh;">
                    <div class="waffle-price" style="font-size:${priceSz};">₹${priceNum}</div>
                </div>
            `;

                grid.appendChild(item);
            });
        }

        // Load once DOM is ready
        document.addEventListener('DOMContentLoaded', loadWaffles);

        // Auto refresh every 5 seconds — picks up orientation + menu changes quickly
        setInterval(loadWaffles, 5000);
    </script>
</body>

</html>
